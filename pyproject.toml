[project]
name = "fourvoices"
version = "0.1.0"
description = "Локальная транскрибация русской речи: GigaSTT + pyannote Community-1"
readme = "README_RU.md"
requires-python = "==3.11.*"
dependencies = [
    "pyannote.audio==4.0.7",
    "PyYAML==6.0.3",
    "soundfile==0.13.1",
    "torch==2.11.0+cpu",
    "torchaudio==2.11.0+cpu",
]

[project.scripts]
fourvoices = "fourvoices.cli:main"

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "ruff==0.14.6",
]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fourvoices"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
# Correctness and modernisation only. Formatting stays hand-made: the code is
# already wrapped for readability and `ruff format` would rewrite every file.
select = ["E", "W", "F", "I", "B", "SIM", "UP", "C4", "RET"]
# An if/else that names both branches reads better here than a long ternary.
ignore = ["SIM108"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.uv]
required-version = ">=0.9.0"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
