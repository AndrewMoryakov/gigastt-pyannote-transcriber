name: tests

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.11
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      - shell: pwsh
        run: ./scripts/check-repo-hygiene.ps1
